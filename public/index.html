<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#0b1020">

  <title>Theo AI</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <!-- History Overlay -->
  <div
    id="history-overlay"
    class="history-overlay"
  ></div>


  <!-- History Sidebar -->
  <aside
    id="history-sidebar"
    class="history-sidebar"
  >

    <div class="history-header">

      <div class="theo-logo">
        Theo AI
      </div>

      <button
        id="close-history"
        class="icon-button"
        type="button"
        aria-label="Close chat history"
      >
        ×
      </button>

    </div>


    <div class="history-tools">

      <div class="history-search">

        <span>⌕</span>

        <input
          id="conversation-search"
          type="search"
          placeholder="Search chats..."
          autocomplete="off"
        >

      </div>


      <button
        id="history-new-chat"
        class="history-new-chat"
        type="button"
      >
        <span>＋</span>
        <span>New Chat</span>
      </button>


      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Switch theme"
      >

        <span id="theme-icon">
          ☀️
        </span>

        <span id="theme-text">
          Light mode
        </span>

      </button>

    </div>


    <div class="history-title">
      Your chats
    </div>


    <div
      id="conversation-list"
      class="conversation-list"
    >

      <div class="history-empty">
        No conversations yet.
      </div>

    </div>

  </aside>


  <!-- Main Application -->
  <main class="app">


    <!-- Main Header -->
    <header class="header">

      <button
        id="open-history"
        class="menu-button"
        type="button"
        aria-label="Open chat history"
      >
        ☰
      </button>

      <div class="header-spacer"></div>

    </header>


    <!-- Chat -->
    <section
      id="chat"
      class="chat"
    >

      <div class="welcome">

        <div class="welcome-avatar">
          T
        </div>

        <h2>
          Hello, I'm Theo 👋
        </h2>

        <p>
          Your personal AI assistant.
          Ask me anything and let's get started.
        </p>

      </div>


      <div class="message assistant">

        <div class="message-content">

          <div class="bubble">
            What would you like to talk about?
          </div>

        </div>

      </div>

    </section>


    <!-- Input -->
    <form id="chat-form" class="input-area composer-v2">

  <div id="composer-attachments" class="composer-attachments" hidden></div>

  <div class="composer-shell" id="composer-shell">

    <div class="composer-content" id="composer-content">

      <textarea
        id="message-input"
        rows="1"
        placeholder="Message Theo..."
        autocomplete="off"
        required
      ></textarea>

    </div>

    <div class="composer-controls" id="composer-controls">

      <button
        id="composer-add-button"
        class="composer-icon-button"
        type="button"
        aria-label="Add attachment"
        title="Add attachment"
      >
        <span class="composer-line-icon composer-plus-icon" aria-hidden="true"></span>
      </button>

      <div class="composer-spacer"></div>

      <button
        id="voice-start-button"
        class="composer-icon-button composer-mic-button"
        type="button"
        aria-label="Use voice"
        title="Use voice"
      >
        <span class="composer-line-icon composer-mic-icon" aria-hidden="true"></span>
      </button>

      <button
        id="send-button"
        class="composer-icon-button composer-send-button"
        type="submit"
        aria-label="Send message"
        title="Send message"
        hidden
      >
        <span class="composer-line-icon composer-send-icon" aria-hidden="true"></span>
      </button>

      <button
        id="aira-button"
        class="composer-aira-button"
        type="button"
        aria-label="Aira"
        title="Aira"
      >
        <span class="composer-aira">Aira</span>
        <span class="composer-aira-dot" aria-hidden="true"></span>
      </button>

    </div>

    <div
      id="voice-recording-controls"
      class="voice-recording-controls"
      hidden
      aria-live="polite"
    >

      <button
        id="voice-cancel-button"
        class="voice-recording-cancel"
        type="button"
        aria-label="Cancel voice recording"
        title="Cancel"
      >×</button>

      <div
        id="voice-waves"
        class="voice-waves"
        aria-hidden="true"
      >
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>

      <button
        id="voice-record-button"
        class="voice-record-button"
        type="button"
        aria-label="Stop voice recording"
        title="Stop recording"
      >
        <span class="voice-record-lines" aria-hidden="true"></span>
      </button>

    </div>

    <div
      id="voice-status"
      class="voice-status"
      aria-live="polite"
    ></div>

  </div>

  <input
    id="composer-file-input"
    type="file"
    hidden
    multiple
    accept="image/jpeg,image/png,image/webp,image/gif"
  >

</form>

</main>


  <script src="/js/app.js"></script>

</body>
</html>
