<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theo AI</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <main class="app">

    <header class="header">
      <div class="logo">Theo AI</div>
      <p>Your AI assistant</p>
    </header>

    <section id="chat" class="chat">

      <div class="message assistant">
        <div class="bubble">
          Hello! 👋 I'm Theo AI. How can I help you today?
        </div>
      </div>

    </section>

    <form id="chat-form" class="input-area">

      <input
        id="message-input"
        type="text"
        placeholder="Ask Theo AI anything..."
        autocomplete="off"
        required
      >

      <button type="submit">
        Send
      </button>

    </form>

  </main>

  <script src="/js/app.js"></script>

</body>
</html>
