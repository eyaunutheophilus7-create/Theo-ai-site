<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#0b1020">

  <title>Theo AI</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <!-- History Overlay -->
  <div
    id="history-overlay"
    class="history-overlay"
  ></div>


  <!-- History Sidebar -->
  <aside
    id="history-sidebar"
    class="history-sidebar"
  >

    <div class="history-header">

      <div class="theo-logo">
        Theo AI
      </div>

      <button
        id="close-history"
        class="icon-button"
        type="button"
        aria-label="Close chat history"
      >
        ×
      </button>

    </div>


    <div class="history-tools">

      <div class="history-search">

        <span>⌕</span>

        <input
          id="conversation-search"
          type="search"
          placeholder="Search chats..."
          autocomplete="off"
        >

      </div>


      <button
        id="history-new-chat"
        class="history-new-chat"
        type="button"
      >
        <span>＋</span>
        <span>New Chat</span>
      </button>


      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Switch theme"
      >

        <span id="theme-icon">
          ☀️
        </span>

        <span id="theme-text">
          Light mode
        </span>

      </button>

    </div>


    <div class="history-title">
      Your chats
    </div>


    <div
      id="conversation-list"
      class="conversation-list"
    >

      <div class="history-empty">
        No conversations yet.
      </div>

    </div>

  </aside>


  <!-- Main Application -->
  <main class="app">


    <!-- Main Header -->
    <header class="header">

      <button
        id="open-history"
        class="menu-button"
        type="button"
        aria-label="Open chat history"
      >
        ☰
      </button>

      <div class="header-spacer"></div>

    </header>


    <!-- Chat -->
    <section
      id="chat"
      class="chat"
    >

      <div class="welcome">

        <div class="welcome-avatar">
          T
        </div>

        <h2>
          Hello, I'm Theo 👋
        </h2>

        <p>
          Your personal AI assistant.
          Ask me anything and let's get started.
        </p>

      </div>


      <div class="message assistant">

        <div class="message-content">

          <div class="bubble">
            What would you like to talk about?
          </div>

        </div>

      </div>

    </section>


    <!-- Input -->
    <form
      id="chat-form"
      class="input-area"
    >

      <div class="input-wrapper">

        <input
          id="message-input"
          type="text"
          placeholder="Message Theo..."
          autocomplete="off"
          required
        >

        <button
          id="send-button"
          type="submit"
          aria-label="Send message"
          title="Send message"
        >
          ↑
        </button>

      </div>

    </form>
        <button
          id="voice-start-button"
          type="button"
          class="voice-compact-button"
          aria-label="Start voice conversation"
          title="Talk to Theo"
        >
          <span class="voice-symbol" aria-hidden="true">◉)))</span>
        </button>

        <button
          id="voice-stop-button"
          type="button"
          class="voice-compact-button voice-stop-compact"
          aria-label="End voice conversation"
          title="End voice conversation"
          hidden
        >
          <span class="voice-symbol" aria-hidden="true">◉</span>
        </button>


</main>


  <script src="/js/app.js"></script>

</body>
</html>
